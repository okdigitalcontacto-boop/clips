# Compila la versión de Windows en un Windows real, la prueba y la deja para descargar.
# Al subir una etiqueta vX.Y.Z, además publica la versión en Releases.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Herramientas (yt-dlp, ffmpeg, Deno)
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile tools/yt-dlp.exe
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg -Force
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe).FullName tools/
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe).FullName tools/
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath tools -Force
          Get-ChildItem tools

      - name: Compilar Clips.exe
        run: |
          python -m PyInstaller --noconfirm clips.spec
          Copy-Item tools dist/Clips/bin -Recurse -Force
          Copy-Item ../LICENSE, ../THIRD_PARTY_NOTICES.md, LEEME.txt, Clips.exe.config dist/Clips/

      - name: Prueba sin internet (montaje de punta a punta)
        run: |
          $p = Start-Process dist/Clips/Clips.exe -ArgumentList "--selftest","--log","$PWD/selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "La prueba ha fallado" }

      - name: Comprimir
        run: Compress-Archive dist/Clips "Clips-Windows-x64.zip" -CompressionLevel Optimal

      - name: Prueba de la ventana como en un PC (zip descargado de internet)
        run: |
          # Como al descargar con el navegador: todo lo que sale del .zip lleva la marca de internet.
          function Marcar($dir) { Get-ChildItem $dir -Recurse -File | ForEach-Object { Set-Content $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" } }
          function Abrir($exe, $flag) {
            $old = $env:CLIPS_NO_UNBLOCK; $env:CLIPS_NO_UNBLOCK = $flag
            $p = Start-Process $exe -PassThru
            $env:CLIPS_NO_UNBLOCK = $old
            Start-Sleep 20
            $titles = (Get-Process | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join " | "
            $title = if ($p.HasExited) { "(cerrada)" } else { (Get-Process -Id $p.Id).MainWindowTitle }
            return @($p, $title, $titles)
          }
          Expand-Archive Clips-Windows-x64.zip -DestinationPath pc -Force
          # Diagnóstico: sin el arreglo debería salir el error de .NET.
          Copy-Item pc/Clips sin-arreglo -Recurse
          Remove-Item sin-arreglo/Clips.exe.config
          Marcar sin-arreglo
          $r = Abrir "$PWD\sin-arreglo\Clips.exe" "1"
          "Sin el arreglo -> ventana: '$($r[1])' · ventanas abiertas: $($r[2])"
          if (-not $r[0].HasExited) { Stop-Process -Id $r[0].Id -Force }
          Get-Process | Where-Object MainWindowTitle -like "*exception*" | Stop-Process -Force
          # La de verdad, con el arreglo.
          Marcar pc
          "Archivos con la marca: $((Get-ChildItem pc -Recurse -File | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }).Count)"
          $r = Abrir "$PWD\pc\Clips\Clips.exe" ""
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$PWD/ventana.png")
          "Con el arreglo -> ventana: '$($r[1])' · ventanas abiertas: $($r[2])"
          if ($r[1] -ne "Clips") { throw "No ha abierto la ventana de Clips" }
          Stop-Process -Id $r[0].Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Clips-Windows-x64
          path: windows/Clips-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas
          path: |
            windows/selftest.log
            windows/ventana.png

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/Clips-Windows-x64.zip
          body: |
            **Clips para Windows** (Windows 10/11 de 64 bits).

            1. Descarga `Clips-Windows-x64.zip` y descomprímelo.
            2. Abre `Clips.exe`. Si sale «Windows protegió su PC»: «Más información» → «Ejecutar de todas formas».
            3. Engranaje → «Clave de Gemini» (gratis en https://aistudio.google.com/apikey) → «Probar».

            © 2026 OK Digital. Todos los derechos reservados.
